name: Publication desktop automatique

on:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/package.json'

permissions:
  contents: read
  actions: write

jobs:
  publier:
    # Les commits de GitHub Actions ne doivent pas s'auto-publier : le job site
    # réécrit latest.json et d'autres automatisations pourront écrire sur main.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Résoudre la version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/windows/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version desktop invalide : $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"

      # Deux portes mènent à release.yml : ce workflow (un bump poussé depuis
      # chatgpt.com, qui ne peut pas lancer `git ship`) et le TAG que `git ship`
      # pousse d'un seul `--atomic` avec le commit. Dans le second cas la
      # release n'existe pas encore quand ce job démarre (`prepare` la crée
      # ~20 s plus tard) : tester la seule release relançait un second build
      # de la même version. Le tag, lui, est déjà là — c'est lui qu'on teste
      # d'abord.
      - name: Vérifier que cette version n'est pas déjà publiée
        id: decision
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if [ -n "$(git ls-remote --tags origin "refs/tags/$TAG")" ]; then
            echo "Le tag $TAG existe déjà sur origin : release.yml tourne (ou a tourné) par lui."
            echo "publier=false" >> "$GITHUB_OUTPUT"
          elif gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : aucune republication."
            echo "publier=false" >> "$GITHUB_OUTPUT"
          else
            echo "publier=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier avec la chaîne de release existante
        if: steps.decision.outputs.publier == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: gh workflow run release.yml --ref main -f version="$VERSION" -f product=app -f publish=true
