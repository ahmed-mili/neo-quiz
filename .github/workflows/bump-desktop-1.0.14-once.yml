name: Bump desktop 1.0.14 once
on:
  push:
    paths:
      - '.github/workflows/bump-desktop-1.0.14-once.yml'
permissions:
  contents: write
  actions: write
jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set version with repository script
        run: node scripts/set-version.mjs 1.0.14
      - name: Commit version and remove this workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bump-desktop-1.0.14-once.yml
          git add apps/windows/package.json apps/windows/package-lock.json
          git commit -m "Version 1.0.14"
          git push origin main
          echo "SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish through release.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f version=1.0.14 -f product=app -f publish=true
