name: Bump desktop 1.0.15 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-desktop-1.0.15-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set version with repository script
        run: node scripts/set-version.mjs patch
