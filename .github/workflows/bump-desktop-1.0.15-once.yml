name: Bump desktop 1.0.15 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bump-desktop-1.0.15-once.yml'

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Set version with repository script
        run: |
          node scripts/set-version.mjs patch
          test "$(node -p "require('./apps/windows/package.json').version")" = "1.0.15"
      - name: Commit version and remove temporary workflow
        run: |
          rm .github/workflows/bump-desktop-1.0.15-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Version 1.0.15"
          git push origin main
