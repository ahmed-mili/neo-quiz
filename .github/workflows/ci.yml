name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # LE CLIQUET DE LA FRONTIÈRE D'HÔTE. Le contrat `src/host/types.ts` dit
      # que c'est ce contrôle, et non la discipline, qui tient la frontière :
      # tant qu'il n'était lancé qu'à la main, c'était encore la discipline.
      # Il coûte moins d'une seconde et ne lit que des fichiers du dépôt —
      # ni vault, ni chaîne Rust, ni Obsidian installé.
      - name: Host boundary ratchet
        run: npm run check:host

      # Même nature : lecture seule sur `src/assets/css` et le thème de l'app.
      # Une variable CSS oubliée ne produit AUCUNE erreur, juste un texte
      # invisible — donc elle se mesure, elle ne se relit pas.
      - name: App theme completeness
        run: npm run check:theme

      # Le bootstrapper lance l'installeur NSIS en silence : l'ordre des
      # arguments et la sélection du paquet ne peuvent donc pas être relus à
      # l'écran. Ce contrôle charge le noyau réellement appelé par l'installeur.
      - name: Installer bootstrapper invariants
        run: npm run check:installer

      # Mêmes étapes que release.yml, sans publication : une casse de build
      # (loader manquant, import cassé) se voit au push, pas au moment du tag.
      - name: Build
        run: npm run build

      - name: Check release artifacts
        run: |
          test -f dist/main.js
          test -f dist/styles.css
          ls -lh dist/

  # Le paquet Linux de l'application : AppImage exige un runner Linux, ce
  # que le poste de développement (Windows) ne peut pas fournir. Job séparé du
  # greffon : une casse ici ne bloque pas la publication du greffon Obsidian.
  #
  # DEUX `npm ci`, DANS CET ORDRE (Ruling 22). Le code partagé qu'`apps/windows`
  # compile importe des paquets déclarés uniquement dans le `package.json` de
  # la RACINE (`mathlive`, `json5`) : un `npm ci` limité à `apps/windows`
  # laisse ces imports introuvables (125 erreurs `tsc` sans le premier
  # `npm ci`, 0 avec, mesuré dans un worktree sans `node_modules` racine).
  #
  # Plus de `continue-on-error` : il masquait un job qui n'a JAMAIS été vert
  # (chaque run échouait sur `executableName` dérivé de `@neo-quiz/windows`,
  # réparé par `executableName: "neo-quiz"` dans la config, tranche 6).
  app-linux-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      - name: Build and package (AppImage)
        run: npm run pack:linux
        working-directory: apps/windows

      - name: Package config and contents
        run: npm run check:package

      - name: Check package artifact
        run: ls -lh dist-installer/*.AppImage
        working-directory: apps/windows

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-linux-appimage
          path: apps/windows/dist-installer/*.AppImage
          if-no-files-found: error

  # Le paquet Windows, symétrique. Il attrape ce que Linux ne voit pas : NSIS,
  # `rcedit` sur l'exécutable, les chemins Windows. Dépôt public, minutes
  # gratuites. `check:package` y lit AUSSI l'asar de `win-unpacked/`, que seul
  # `pack:win` produit.
  app-windows-package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      - name: Build and package (NSIS)
        run: npm run pack:win
        working-directory: apps/windows

      - name: Package config and contents
        run: npm run check:package

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-setup
          path: apps/windows/dist-installer/*.exe
          if-no-files-found: error
