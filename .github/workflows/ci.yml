name: CI

on:
  push:
    branches:
      - '**'
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      # LE CLIQUET DE LA FRONTIÈRE D'HÔTE. Le contrat `src/host/types.ts` dit
      # que c'est ce contrôle, et non la discipline, qui tient la frontière :
      # tant qu'il n'était lancé qu'à la main, c'était encore la discipline.
      # Il coûte moins d'une seconde et ne lit que des fichiers du dépôt —
      # ni vault, ni chaîne Rust, ni Obsidian installé.
      - name: Host boundary ratchet
        run: npm run check:host

      # Même nature : lecture seule sur `src/assets/css` et le thème de l'app.
      # Une variable CSS oubliée ne produit AUCUNE erreur, juste un texte
      # invisible — donc elle se mesure, elle ne se relit pas.
      - name: App theme completeness
        run: npm run check:theme

      # Mêmes étapes que release.yml, sans publication : une casse de build
      # (loader manquant, import cassé) se voit au push, pas au moment du tag.
      - name: Build
        run: npm run build

      - name: Check release artifacts
        run: |
          test -f dist/main.js
          test -f dist/styles.css
          ls -lh dist/

  # Le paquet Linux de l'application Windows (tâche 7 de la migration
  # Tauri → Electron) : AppImage exige un runner Linux pour se construire,
  # ce que la machine de développement (Windows) ne peut pas fournir. Job
  # séparé du greffon ci-dessus : une casse ici ne doit pas bloquer la
  # publication du greffon Obsidian, qui n'a aucun rapport avec la coquille.
  #
  # DEUX `npm ci`, DANS CET ORDRE (Ruling 22, ronde de correction 1). Le code
  # partagé qu'`apps/windows` compile importe des paquets déclarés
  # uniquement dans le `package.json` de la RACINE (`mathlive` par
  # `apps/windows/src/host/math.ts` et `src/engine/math-input.ts`, `json5`
  # par `src/quiz-utils.ts`) : un `npm ci` limité à `apps/windows` laisse ces
  # imports introuvables. En local ça passait par accident, parce que
  # `node_modules` de la racine existait déjà sur le poste ; un runner CI
  # neuf n'a rien de tel — vérifié en simulant l'un et l'autre dans un
  # worktree sans `node_modules` racine (`tsc --noEmit` : 125 erreurs sans
  # le premier `npm ci`, 0 avec).
  #
  # `continue-on-error: true` TANT QUE CE JOB N'A JAMAIS ÉTÉ VU VERT SUR
  # GITHUB : un rouge permanent sur une branche `push: '**'` finit ignoré
  # par réflexe, et masquerait alors un vrai rouge du job `build` (le
  # cliquet `check:host`, entre autres) — pire que l'absence d'AppImage.
  # À retirer une fois ce job observé vert au moins une fois sur GitHub.
  app-linux-package:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies (racine)
        run: npm ci

      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows

      - name: Build and package (AppImage)
        run: npm run pack:linux
        working-directory: apps/windows

      - name: Check package artifact
        run: ls -lh dist-installer/*.AppImage
        working-directory: apps/windows

      - name: Upload AppImage
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-linux-appimage
          path: apps/windows/dist-installer/*.AppImage
          if-no-files-found: error
