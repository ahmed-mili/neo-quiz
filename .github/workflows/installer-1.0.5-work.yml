name: Installer 1.0.5 implementation

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/installer-1.0.5-work.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  implement-publish-verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Implement, validate, publish and verify
        run: bash scripts/run-installer-1.0.5.sh
