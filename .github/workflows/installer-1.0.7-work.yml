name: Installer 1.0.7 legal text fix

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/installer-1.0.7-work.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate-windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows
      - name: Apply 1.0.7 legal-text fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/installer/renderer-reference.ts')
          s = p.read_text(encoding='utf-8')
          old = '\trendreCommentaires(etape, "nqi-progress-feedback");\n\trendreLegal(etape, "nqi-progress-legal");\n'
          new = '\trendreCommentaires(etape, "nqi-progress-feedback");\n\t/* Les mentions légales sont acceptées avant le clic sur Installer (étape 2).\n\t   Comme Google Play Games, elles ne sont plus répétées pendant le\n\t   téléchargement et l’installation : la progression reste visuellement nette. */\n'
          if s.count(old) != 1:
              raise SystemExit('bloc legal progression unique introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/check-installer.mjs')
          s = p.read_text(encoding='utf-8')
          needle = '\tr.check("démarrage : le bootstrapper évite les deux extractions coûteuses",\n'
          if s.count(needle) != 1:
              raise SystemExit('point insertion check introuvable')
          check = '''\tconst debutProgression = renduInstallateur.indexOf("function rendreEtapeProgression");\n\tconst debutDemarrage = renduInstallateur.indexOf("function rendreDemarrage", debutProgression);\n\tconst blocProgression = debutProgression >= 0 && debutDemarrage > debutProgression\n\t\t? renduInstallateur.slice(debutProgression, debutDemarrage)\n\t\t: "";\n\tr.check("expérience : mentions légales absentes à partir de l'étape 3",\n\t\t[blocProgression.includes("rendreLegal("), renduInstallateur.includes("rendreLegal(panneau);")],\n\t\t[false, true]);\n\n'''
          p.write_text(s.replace(needle, check + needle, 1), encoding='utf-8')
          PY
          node scripts/set-version.mjs 1.0.7
      - name: Validate Windows installer and package for real
        shell: bash
        run: |
          set -euo pipefail
          npm run check:installer
          npm --prefix apps/windows run typecheck:installer
          npm --prefix apps/windows run pack:win
          npm run check:package
          npm --prefix apps/windows run pack:installer
          test -s apps/windows/dist-installer/neo-quiz-setup-1.0.7.exe
          test -s apps/windows/dist-installer/latest.yml
          test -s apps/windows/dist-installer-bootstrapper/Install-NeoQuiz.exe

  implement-publish-verify:
    needs: validate-windows-package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows
      - name: Apply 1.0.7 legal-text fix
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/installer/renderer-reference.ts')
          s = p.read_text(encoding='utf-8')
          old = '\trendreCommentaires(etape, "nqi-progress-feedback");\n\trendreLegal(etape, "nqi-progress-legal");\n'
          new = '\trendreCommentaires(etape, "nqi-progress-feedback");\n\t/* Les mentions légales sont acceptées avant le clic sur Installer (étape 2).\n\t   Comme Google Play Games, elles ne sont plus répétées pendant le\n\t   téléchargement et l’installation : la progression reste visuellement nette. */\n'
          if s.count(old) != 1:
              raise SystemExit('bloc legal progression unique introuvable')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')

          p = Path('scripts/check-installer.mjs')
          s = p.read_text(encoding='utf-8')
          needle = '\tr.check("démarrage : le bootstrapper évite les deux extractions coûteuses",\n'
          if s.count(needle) != 1:
              raise SystemExit('point insertion check introuvable')
          check = '''\tconst debutProgression = renduInstallateur.indexOf("function rendreEtapeProgression");\n\tconst debutDemarrage = renduInstallateur.indexOf("function rendreDemarrage", debutProgression);\n\tconst blocProgression = debutProgression >= 0 && debutDemarrage > debutProgression\n\t\t? renduInstallateur.slice(debutProgression, debutDemarrage)\n\t\t: "";\n\tr.check("expérience : mentions légales absentes à partir de l'étape 3",\n\t\t[blocProgression.includes("rendreLegal("), renduInstallateur.includes("rendreLegal(panneau);")],\n\t\t[false, true]);\n\n'''
          p.write_text(s.replace(needle, check + needle, 1), encoding='utf-8')
          PY
      - name: Set version with repository script
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-version.mjs 1.0.7
          test "$(node -p "require('./apps/windows/package.json').version")" = "1.0.7"
          test "$(node -p "require('./apps/windows/package-lock.json').version")" = "1.0.7"
          test "$(node -p "require('./apps/windows/package-lock.json').packages[''].version")" = "1.0.7"
      - name: Prove legal-text control is discriminating
        shell: bash
        run: |
          set -euo pipefail
          cp apps/windows/installer/renderer-reference.ts /tmp/renderer.good
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/installer/renderer-reference.ts')
          s = p.read_text(encoding='utf-8')
          needle = '\trendreCommentaires(etape, "nqi-progress-feedback");\n'
          if s.count(needle) != 1:
              raise SystemExit('point de rupture unique introuvable')
          p.write_text(s.replace(needle, needle + '\trendreLegal(etape, "nqi-progress-legal");\n', 1), encoding='utf-8')
          PY
          set +e
          npm run check:installer > /tmp/discriminance-legal.log 2>&1
          code=$?
          set -e
          cat /tmp/discriminance-legal.log
          test "$code" -ne 0
          grep -F "ÉCHEC  expérience : mentions légales absentes à partir de l'étape 3" /tmp/discriminance-legal.log
          cp /tmp/renderer.good apps/windows/installer/renderer-reference.ts
          npm run check:installer
      - name: Run pre-publication checks
        shell: bash
        run: |
          set -euo pipefail
          npm run check:installer
          npm run check:package
          npm run check:updater
          npm run check
          npm --prefix apps/windows run typecheck:installer
          npm --prefix apps/windows run build:installer
      - name: Commit 1.0.7 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/windows/installer/renderer-reference.ts scripts/check-installer.mjs apps/windows/package.json apps/windows/package-lock.json
          git diff --cached --quiet && { echo "::error::Aucun changement 1.0.7 à committer."; exit 1; }
          git commit -m "fix(installer): hide legal text during progress in 1.0.7"
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Publish through existing release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.7 -f product=app -f publish=true
          run_id=""
          for tentative in $(seq 1 40); do
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --limit 40 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${RELEASE_SHA}\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ] || { echo "::error::Run release.yml introuvable."; exit 1; }
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
      - name: Wait for final release CI result
        shell: bash
        run: |
          set +e
          gh run watch "$RELEASE_RUN_ID" --exit-status --interval 10
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh run view "$RELEASE_RUN_ID" --log-failed || true
            exit "$code"
          fi
          test "$(gh run view "$RELEASE_RUN_ID" --json conclusion --jq '.conclusion')" = "success"
      - name: Verify real 1.0.7 release assets and latest
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.7" > "$release_json"
          for requis in "Install-NeoQuiz.exe" "Install-NeoQuiz-fr.exe" "neo-quiz-setup-1.0.7.exe" "neo-quiz-setup-1.0.7.exe.blockmap" "latest.yml" "neo-quiz-1.0.7.AppImage" "latest-linux.yml" "neo-quiz.AppImage"; do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom and .state == "uploaded" and .size > 0)' "$release_json" >/dev/null || exit 1
          done
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "desktop-v1.0.7"
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/latest.json?ref=main" --jq '.content' | base64 -d)
          printf '%s' "$latest_main" | grep -F '"tag_name":"desktop-v1.0.7"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz.exe"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz-fr.exe"'
      - name: Verify GitHub Pages serves 1.0.7
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for tentative in $(seq 1 60); do
            contenu=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?installer-107=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$contenu" | grep -F '"tag_name":"desktop-v1.0.7"' >/dev/null \
              && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz.exe"' >/dev/null \
              && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz-fr.exe"' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo "::error::GitHub Pages ne sert pas la 1.0.7 complète."; exit 1; }
          echo "INSTALLER_1_0_7_READY"
