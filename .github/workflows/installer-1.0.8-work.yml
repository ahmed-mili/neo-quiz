name: Installer 1.0.8 launch readiness

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/installer-1.0.8-work.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  validate-windows-package:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows
      - name: Apply 1.0.8 changes and version
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare-installer-1.0.8.py
          node scripts/set-version.mjs 1.0.8
      - name: Validate Windows installer and package for real
        shell: bash
        run: |
          set -euo pipefail
          npm run check:installer
          npm --prefix apps/windows run typecheck
          npm --prefix apps/windows run typecheck:electron
          npm --prefix apps/windows run typecheck:installer
          npm --prefix apps/windows run pack:win
          npm run check:package
          npm --prefix apps/windows run pack:installer
          test -s apps/windows/dist-installer/neo-quiz-setup-1.0.8.exe
          test -s apps/windows/dist-installer/latest.yml
          test -s apps/windows/dist-installer-bootstrapper/Install-NeoQuiz.exe

  implement-publish-verify:
    needs: validate-windows-package
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Install dependencies
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows
      - name: Apply 1.0.8 launch-readiness changes
        run: python scripts/prepare-installer-1.0.8.py
      - name: Set version with repository script
        shell: bash
        run: |
          set -euo pipefail
          node scripts/set-version.mjs 1.0.8
          test "$(node -p "require('./apps/windows/package.json').version")" = "1.0.8"
          test "$(node -p "require('./apps/windows/package-lock.json').version")" = "1.0.8"
          test "$(node -p "require('./apps/windows/package-lock.json').packages[''].version")" = "1.0.8"

      - name: Prove separate-launch-window control is discriminating
        shell: bash
        run: |
          set -euo pipefail
          cp apps/windows/installer/main.ts /tmp/installer-main.good
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/installer/main.ts')
          s = p.read_text(encoding='utf-8')
          old = 'query: { lang: langue, mode: "launch" }'
          if s.count(old) != 1:
              raise SystemExit('mode launch unique introuvable')
          p.write_text(s.replace(old, 'query: { lang: langue, mode: "launch-broken" }', 1), encoding='utf-8')
          PY
          set +e
          npm run check:installer > /tmp/discriminance-launch-window.log 2>&1
          code=$?
          set -e
          cat /tmp/discriminance-launch-window.log
          test "$code" -ne 0
          grep -F 'ÉCHEC  fin installation : fenêtre de lancement séparée et centrée, jamais un modal' /tmp/discriminance-launch-window.log
          cp /tmp/installer-main.good apps/windows/installer/main.ts
          npm run check:installer

      - name: Prove app-readiness control is discriminating
        shell: bash
        run: |
          set -euo pipefail
          cp apps/windows/src/main.ts /tmp/app-renderer.good
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/src/main.ts')
          s = p.read_text(encoding='utf-8')
          old = 'pont().fenetre.prete()'
          if s.count(old) != 1:
              raise SystemExit('signal prete unique introuvable')
          p.write_text(s.replace(old, 'pont().fenetre.fermer()', 1), encoding='utf-8')
          PY
          set +e
          npm run check:installer > /tmp/discriminance-ready.log 2>&1
          code=$?
          set -e
          cat /tmp/discriminance-ready.log
          test "$code" -ne 0
          grep -F 'ÉCHEC  fin installation : la vraie app devient visible seulement quand elle est prête' /tmp/discriminance-ready.log
          cp /tmp/app-renderer.good apps/windows/src/main.ts
          npm run check:installer

      - name: Run pre-publication checks
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml", aliases: true); puts "release.yml YAML OK"'
          npm run check:installer
          npm run check:package
          npm run check:updater
          npm run check
          npm --prefix apps/windows run typecheck
          npm --prefix apps/windows run typecheck:electron
          npm --prefix apps/windows run typecheck:installer
          npm --prefix apps/windows run build:installer

      - name: Commit 1.0.8 to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add \
            apps/windows/installer/main.ts \
            apps/windows/installer/renderer-reference.ts \
            apps/windows/installer/protocole.ts \
            apps/windows/installer/style-details.css \
            apps/windows/electron/pont.ts \
            apps/windows/electron/preload.ts \
            apps/windows/electron/canaux.ts \
            apps/windows/electron/main.ts \
            apps/windows/src/main.ts \
            scripts/check-installer.mjs \
            apps/windows/package.json \
            apps/windows/package-lock.json
          git diff --cached --quiet && { echo "::error::Aucun changement 1.0.8 à committer."; exit 1; }
          git commit -m "fix(installer): dedicated launch window and ready app in 1.0.8"
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish through existing release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.8 -f product=app -f publish=true
          run_id=""
          for tentative in $(seq 1 40); do
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --limit 40 --json databaseId,headSha \
              --jq ".[] | select(.headSha == \"${RELEASE_SHA}\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ] || { echo "::error::Run release.yml introuvable."; exit 1; }
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Release run: $run_id"

      - name: Wait for final release CI result
        shell: bash
        run: |
          set +e
          gh run watch "$RELEASE_RUN_ID" --exit-status --interval 10
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh run view "$RELEASE_RUN_ID" --log-failed || true
            exit "$code"
          fi
          test "$(gh run view "$RELEASE_RUN_ID" --json conclusion --jq '.conclusion')" = "success"

      - name: Verify real 1.0.8 release assets and latest
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.8" > "$release_json"
          for requis in \
            "Install-NeoQuiz.exe" \
            "Install-NeoQuiz-fr.exe" \
            "neo-quiz-setup-1.0.8.exe" \
            "neo-quiz-setup-1.0.8.exe.blockmap" \
            "latest.yml" \
            "neo-quiz-1.0.8.AppImage" \
            "latest-linux.yml" \
            "neo-quiz.AppImage"
          do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom and .state == "uploaded" and .size > 0)' "$release_json" >/dev/null || {
              echo "::error::Asset final absent ou vide: $requis"
              exit 1
            }
          done
          jq -e --arg nom "neo-quiz-setup-1.0.8.exe" '.assets[] | select(.name == $nom) | .digest | select(type == "string" and test("^sha256:[0-9a-fA-F]{64}$"))' "$release_json" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "desktop-v1.0.8"
          version_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/windows/package.json?ref=main" --jq '.content' | base64 -d | jq -r '.version')
          test "$version_main" = "1.0.8"
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/latest.json?ref=main" --jq '.content' | base64 -d)
          printf '%s' "$latest_main" | grep -F '"tag_name":"desktop-v1.0.8"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz.exe"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz-fr.exe"'

      - name: Verify GitHub Pages serves 1.0.8
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for tentative in $(seq 1 60); do
            contenu=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?installer-108=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$contenu" | grep -F '"tag_name":"desktop-v1.0.8"' >/dev/null \
              && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz.exe"' >/dev/null \
              && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz-fr.exe"' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo "::error::GitHub Pages ne sert pas la 1.0.8 complète."; exit 1; }
          echo "INSTALLER_1_0_8_READY"
