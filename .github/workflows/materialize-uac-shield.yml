name: Matérialiser le bouclier UAC

# Ce workflow temporaire transforme en binaire l'asset dérivé du PNG fourni.
# Le connecteur GitHub n'écrit que du texte via l'API Contents ; la conversion
# se fait donc sur le runner et le SHA-256 empêche toute substitution silencieuse.
on:
  push:
    branches:
      - bootstrapper-compact-2026-09-14
    paths:
      - '.github/workflows/materialize-uac-shield.yml'

jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7

      - name: Reconstituer le PNG
        shell: bash
        run: |
          cat > /tmp/uac-shield.b64 <<'EOF'
          
          EOF
          base64 --decode /tmp/uac-shield.b64 > apps/windows/installer/uac-shield.png
          test "$(sha256sum apps/windows/installer/uac-shield.png | cut -d' ' -f1)" = "27791826ab88a02e18de8ca8d84aa20a9ed407c5a84aa22afa6044d3c8705b8d"

      - name: Committer l'asset binaire
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/installer/uac-shield.png
          git commit -m "installer: remplacer le bouclier UAC"
          git push origin HEAD:${GITHUB_REF_NAME}
