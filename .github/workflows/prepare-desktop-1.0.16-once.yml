name: Prepare desktop 1.0.16 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-desktop-1.0.16-once.yml'

permissions:
  contents: write
  actions: write

jobs:
  validate-bump-publish:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/windows ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify current version and source checks
        shell: pwsh
        run: |
          $version = node -p "require('./apps/windows/package.json').version"
          if ($version -ne '1.0.15') { throw "Version inattendue avant bump: $version" }
          npm run check:theme
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:updater
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/windows run typecheck:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build real Windows packages
        shell: pwsh
        run: |
          npm --prefix apps/windows run pack:win
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix apps/windows run pack:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run check:installer
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Bump to 1.0.16 with repository script
        shell: pwsh
        run: |
          node scripts/set-version.mjs patch
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = node -p "require('./apps/windows/package.json').version"
          if ($version -ne '1.0.16') { throw "Version inattendue après bump: $version" }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/windows/package.json apps/windows/package-lock.json
          git commit -m "Version 1.0.16"
          git push origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Trigger existing release chain
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml --ref main -f version=1.0.16 -f product=app -f publish=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
