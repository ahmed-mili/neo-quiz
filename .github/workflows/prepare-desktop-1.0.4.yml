name: Préparer la publication desktop 1.0.4

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-desktop-1.0.4.yml'

permissions:
  contents: write
  actions: write

jobs:
  preparer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Synchroniser la version 1.0.4
        run: node scripts/set-version.mjs 1.0.4

      - name: Rendre la publication manuelle publiable et ajouter l'automatisation
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          chemin = Path('.github/workflows/release.yml')
          texte = chemin.read_text(encoding='utf-8')

          def remplace_unique(ancien: str, nouveau: str, nom: str) -> None:
              global texte
              compte = texte.count(ancien)
              if compte != 1:
                  raise SystemExit(f'{nom}: 1 occurrence attendue, {compte} trouvée(s)')
              texte = texte.replace(ancien, nouveau, 1)

          # Le mode répétition doit rester le défaut ; « publish » rend la même
          # chaîne capable de publier sans recopier la logique de build ailleurs.
          remplace_unique(
              '        default: "app"\n\njobs:\n',
              '        default: "app"\n      publish:\n        description: "Publier réellement la release demandée"\n        required: true\n        type: boolean\n        default: false\n\njobs:\n',
              'entrée publish',
          )

          for nom in [
              'Create Release',
              'Attach plugin to release',
              'Attach Windows package to release',
              'Attach AppImage to release',
          ]:
              remplace_unique(
                  f'      - name: {nom}\n        if: github.event_name != \'workflow_dispatch\'\n',
                  f'      - name: {nom}\n        if: github.event_name != \'workflow_dispatch\' || github.event.inputs.publish == \'true\'\n',
                  f'condition {nom}',
              )

          for nom in [
              'Upload plugin (répétition)',
              'Upload Windows package (répétition)',
              'Upload AppImage (répétition)',
          ]:
              remplace_unique(
                  f'      - name: {nom}\n        if: github.event_name == \'workflow_dispatch\'\n',
                  f'      - name: {nom}\n        if: github.event_name == \'workflow_dispatch\' && github.event.inputs.publish != \'true\'\n',
                  f'condition {nom}',
              )

          remplace_unique(
              "signing-policy-slug: $" + "{{ github.event_name == 'workflow_dispatch' && 'test-signing' || 'release-signing' }}",
              "signing-policy-slug: $" + "{{ github.event_name == 'workflow_dispatch' && github.event.inputs.publish != 'true' && 'test-signing' || 'release-signing' }}",
              'politique SignPath',
          )

          ancienne_condition_site = "    if: $" + "{{ !cancelled() && github.event_name != 'workflow_dispatch' && needs.prepare.result == 'success' && needs.plugin.result != 'failure' && needs['app-windows'].result != 'failure' && needs['app-linux'].result != 'failure' }}"
          nouvelle_condition_site = "    if: $" + "{{ !cancelled() && (github.event_name != 'workflow_dispatch' || github.event.inputs.publish == 'true') && needs.prepare.result == 'success' && needs.plugin.result != 'failure' && needs['app-windows'].result != 'failure' && needs['app-linux'].result != 'failure' }}"
          remplace_unique(ancienne_condition_site, nouvelle_condition_site, 'condition site')

          lignes = texte.splitlines()
          index_release = next(i for i, ligne in enumerate(lignes) if ligne == '      - name: Create Release')
          index_nom = next(i for i in range(index_release, min(index_release + 20, len(lignes))) if lignes[i].strip().startswith('name: '))
          cible = '          target_commitish: $' + '{{ github.sha }}'
          if cible not in lignes[index_release:index_release + 20]:
              lignes.insert(index_nom + 1, cible)
          texte = '\n'.join(lignes) + '\n'
          chemin.write_text(texte, encoding='utf-8')

          # Une hausse de version sur main suffit désormais : ce petit workflow
          # réutilise release.yml par workflow_dispatch au lieu de dupliquer le build.
          expr_token = '$' + '{{ github.token }}'
          expr_version = '$' + '{{ steps.version.outputs.version }}'
          expr_tag = '$' + '{{ steps.version.outputs.tag }}'
          auto = f'''name: Publication desktop automatique

on:
  push:
    branches:
      - main
    paths:
      - 'apps/windows/package.json'

permissions:
  contents: read
  actions: write

jobs:
  publier:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Résoudre la version
        id: version
        shell: bash
        run: |
          version=$(node -p "require('./apps/windows/package.json').version")
          if ! [[ "$version" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Version desktop invalide : $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$version" >> "$GITHUB_OUTPUT"

      - name: Vérifier que cette version n'est pas déjà publiée
        id: decision
        env:
          GH_TOKEN: {expr_token}
          TAG: {expr_tag}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "La release $TAG existe déjà : aucune republication."
            echo "publier=false" >> "$GITHUB_OUTPUT"
          else
            echo "publier=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publier avec la chaîne de release existante
        if: steps.decision.outputs.publier == 'true'
        env:
          GH_TOKEN: {expr_token}
          VERSION: {expr_version}
        run: gh workflow run release.yml --ref main -f version="$VERSION" -f product=app -f publish=true
'''
          Path('.github/workflows/auto-release-desktop.yml').write_text(auto, encoding='utf-8')
          PY

      - name: Installer les dépendances racine
        run: npm ci

      - name: Installer les dépendances Windows
        run: npm ci
        working-directory: apps/windows

      - name: Vérifier les invariants de l'installeur
        run: npm run check:installer

      - name: Enregistrer la préparation et retirer ce workflow ponctuel
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-desktop-1.0.4.yml
          git add apps/windows/package.json apps/windows/package-lock.json .github/workflows/release.yml .github/workflows/auto-release-desktop.yml
          git commit -m "Version 1.0.4 et publication desktop automatique"
          git push origin main

      - name: Publier 1.0.4
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref main -f version=1.0.4 -f product=app -f publish=true
