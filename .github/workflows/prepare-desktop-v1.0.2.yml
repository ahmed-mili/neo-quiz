name: Préparer desktop-v1.0.2

# Ce workflow est volontairement temporaire : il exécute le script de version
# du dépôt au lieu de répliquer sa logique dans une mutation distante. Ainsi le
# lockfile et le manifeste de l'application restent synchronisés par la même
# règle que pour une publication locale.
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-desktop-v1.0.2.yml'

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Écrire la version avec le script du dépôt
        run: node scripts/set-version.mjs 1.0.2

      - name: Publier le commit de version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add apps/windows/package.json apps/windows/package-lock.json
          git diff --check
          git commit -m "Version 1.0.2"
          git push origin main
