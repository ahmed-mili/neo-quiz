name: Release Neo Quiz

# Deux déclencheurs, une seule chaîne :
#   - un tag `v*` PUBLIE : release GitHub avec le greffon (main.js, styles.css,
#     manifest.json), l'installeur Windows et l'AppImage ;
#   - `workflow_dispatch` RÉPÈTE sans publier : mêmes jobs, mêmes builds, mais
#     les fichiers sont déposés en artefacts de workflow et aucune release
#     n'est créée. C'est ainsi qu'on éprouve cette chaîne sur un dépôt public
#     sans laisser une release de test derrière soi.
# La signature Authenticode de l'installeur Windows (SignPath) est optionnelle,
# activée par la variable de dépôt `SIGNPATH_ORGANIZATION_ID` : tant qu'elle est
# absente, `main` reste publiable non signé.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "Version à répéter (sans le v), écrite dans le manifeste le temps du build"
        required: true
        default: "0.0.0-repetition"

jobs:
  plugin:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      # Sur tag : la version vient du tag. En répétition : de l'entrée saisie.
      - name: Resolve version
        id: version
        shell: bash
        # L'entrée passe par l'environnement, jamais interpolée dans le script : interpolée, une valeur saisie serait exécutée comme du shell.
        env:
          VERSION_SAISIE: ${{ github.event.inputs.version }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
            echo "tag=v$VERSION_SAISIE" >> "$GITHUB_OUTPUT"
          else
            tag="${GITHUB_REF#refs/tags/}"
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
            echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
          fi

      # UNE SEULE façon d'écrire la version : le script du dépôt, jamais un
      # `node -e` inline qui divergerait de lui.
      # `set-version.mjs` SORT EN 1 quand le manifeste porte déjà le numéro
      # (« Rien à changer ») : c'est le cas normal d'un tag posé juste après
      # le commit « Version X ». Le mode répétition ne le voyait pas, il change
      # toujours le numéro. D'où le test avant l'appel.
      - name: Update manifest version
        shell: bash
        env:
          VERSION_VOULUE: ${{ steps.version.outputs.version }}
        run: |
          actuelle=$(node -p "require('./src/assets/manifest.json').version")
          if [ "$actuelle" != "$VERSION_VOULUE" ]; then node scripts/set-version.mjs "$VERSION_VOULUE"; fi

      - name: Type check
        run: npm run check

      # Le build passe par esbuild.config.mjs : une config esbuild dupliquée ici
      # diverge en silence (les loaders de fontes MathLive y ont manqué).
      # Hors Windows, aucun vault n'est détecté : la sortie reste dans dist/.
      - name: Build
        run: npm run build

      - name: Collect release files
        run: |
          mkdir -p release
          cp dist/main.js dist/styles.css release/
          cp src/assets/manifest.json release/manifest.json
          ls -lh release/

      - name: Upload plugin (répétition)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-plugin
          path: release/*
          if-no-files-found: error

      - name: Create Release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          name: "${{ steps.version.outputs.tag }}"
          body: "Release ${{ steps.version.outputs.tag }}"
          # Pré-version dès que le tag porte un suffixe semver (v2.0.0-beta,
          # -rc.1, -alpha…) : c'est la définition même de semver, donc une
          # future v2.1.0 sans suffixe sortira en release normale sans qu'on
          # ait à repasser ici.
          prerelease: ${{ contains(steps.version.outputs.tag, '-') }}
          files: |
            release/main.js
            release/manifest.json
            release/styles.css

  # L'application, deux paquets, deux runners. `needs: plugin` pour deux
  # raisons : la release existe déjà quand ils y attachent leurs fichiers, et
  # un greffon qui ne compile pas n'a pas à produire d'installeur. Un échec
  # de l'un des deux n'annule ni l'autre ni la release du greffon.
  app-windows:
    needs: plugin
    runs-on: windows-latest
    # `actions: read` en plus de `contents: write` : un bloc `permissions`
    # explicite met tout le reste à `none`, et l'action SignPath a besoin de
    # lire l'artefact de workflow qu'elle signe (`github-artifact-id`).
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies (racine)
        run: npm ci
      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows
      # Même garde que le job `plugin` : « Rien à changer » sort en 1.
      - name: Update manifest version
        shell: bash
        env:
          VERSION_VOULUE: ${{ needs.plugin.outputs.version }}
        run: |
          actuelle=$(node -p "require('./src/assets/manifest.json').version")
          if [ "$actuelle" != "$VERSION_VOULUE" ]; then node scripts/set-version.mjs "$VERSION_VOULUE"; fi
      - name: Build and package (NSIS)
        run: npm run pack:win
        working-directory: apps/windows

      # Les étapes SignPath ci-dessous sont sautées tant que
      # `vars.SIGNPATH_ORGANIZATION_ID` n'est pas posée : `main` reste
      # publiable non signé pendant que la demande de certificat est en cours.
      - name: Upload unsigned installer for SignPath
        id: unsigned
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-unsigned
          # L'action SignPath ne signe qu'un artefact de WORKFLOW (c'est ainsi
          # qu'elle prouve que GitHub a construit le fichier), et l'exe SEUL :
          # la config d'artefact (.signpath/artifact-configurations/initial.xml)
          # n'attend que lui.
          path: apps/windows/dist-installer/neo-quiz-setup-*.exe
          if-no-files-found: error

      - name: Submit signing request
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          # En répétition (workflow_dispatch) : le certificat de test,
          # auto-signé, n'engage pas la réputation du dépôt. Sur un tag : le
          # certificat SignPath Foundation, dont chaque demande exige
          # l'approbation manuelle d'Ahmed dans le portail SignPath — d'où le
          # délai d'attente d'une heure ci-dessous.
          signing-policy-slug: ${{ github.event_name == 'workflow_dispatch' && 'test-signing' || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/windows/signed
          parameters: |
            version: ${{ toJSON(needs.plugin.outputs.version) }}

      # Sans le script suivant, `latest.yml` et le blockmap continueraient de
      # décrire l'exe NON signé : electron-updater rejetterait la mise à jour
      # chez chaque utilisateur (sha512 mismatch).
      - name: Replace the installer with the signed one
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: bash
        run: |
          ls apps/windows/signed/
          cp apps/windows/signed/neo-quiz-setup-*.exe apps/windows/dist-installer/
          node scripts/update-info-after-signing.mjs

      - name: Verify the signature
        if: vars.SIGNPATH_ORGANIZATION_ID != ''
        shell: pwsh
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          $nomExe = (Select-String -Path apps/windows/dist-installer/latest.yml -Pattern '^path:\s*(.+)$').Matches[0].Groups[1].Value.Trim()
          $cheminExe = "apps/windows/dist-installer/$nomExe"
          $sig = Get-AuthenticodeSignature -LiteralPath $cheminExe
          Write-Host "Status : $($sig.Status)"
          Write-Host "Subject du certificat : $($sig.SignerCertificate.Subject)"

          # Le CN seul, tel qu'electron-updater le compare (`subject.get("CN")`)
          # à `publisherName` : c'est CETTE valeur qu'il faut recopier dans
          # `win.signtoolOptions.publisherName`, pas le Subject entier.
          $cn = $sig.SignerCertificate.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          Write-Host "CN du certificat (valeur pour publisherName) : $cn"

          # electron-builder écrit `publisherName` en LISTE YAML
          # (`publisherName:` puis `  - Nom`), jamais sur une ligne : la regex
          # accepte les deux formes.
          $cheminAppUpdate = "apps/windows/dist-installer/win-unpacked/resources/app-update.yml"
          $publisherName = $null
          if (Test-Path $cheminAppUpdate) {
            $m = [regex]::Match((Get-Content $cheminAppUpdate -Raw), '(?ms)^publisherName:\s*(?:-\s*)?(\S[^\r\n]*)')
            if ($m.Success) { $publisherName = $m.Groups[1].Value.Trim().Trim("'", '"') }
          }
          Write-Host "publisherName d'app-update.yml : $(if ($publisherName) { $publisherName } else { '(absent)' })"

          if ($env:EVENEMENT -ne 'workflow_dispatch') {
            # Certificat SignPath Foundation, approuvé par Windows : la
            # signature doit être valide.
            if ($sig.Status -ne 'Valid') {
              Write-Error "Signature invalide : $($sig.Status)"
              exit 1
            }
            # Égalité STRICTE : une sous-chaîne qui « ressemble » laisserait
            # passer un publisherName qu'electron-updater refuserait.
            if ($publisherName -and $cn -cne $publisherName) {
              Write-Error "publisherName ($publisherName) ne correspond pas au CN du certificat ($cn)"
              exit 1
            }
          } else {
            # Certificat de test (répétition), non approuvé par Windows :
            # on affiche seulement, sans exiger 'Valid'.
            Write-Host "Répétition (workflow_dispatch) : signature affichée sans être exigée valide."
          }

      # Déplacé après les étapes SignPath : ce contrôle doit voir le
      # latest.yml et le blockmap RECALCULÉS après signature, pas ceux
      # d'electron-builder sur l'exe non signé.
      - name: Package config and contents
        run: npm run check:package
      - name: Upload installer (répétition)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-windows-setup
          path: |
            apps/windows/dist-installer/*.exe
            apps/windows/dist-installer/*.exe.blockmap
            apps/windows/dist-installer/latest.yml
          if-no-files-found: error
      # Copie sous un nom FIXE, en plus du fichier versionné : c'est ce nom
      # que la page de téléchargement (docs/index.html) vise en permanence via
      # releases/latest/download/neo-quiz-setup.exe, sans jamais changer de
      # lien d'une version à l'autre. Ne remplace rien : latest.yml et le
      # .blockmap continuent de nommer le fichier VERSIONNÉ, seul lu par
      # electron-updater.
      - name: Copy installer under a fixed name
        shell: bash
        run: |
          ls apps/windows/dist-installer/neo-quiz-setup-*.exe
          cp apps/windows/dist-installer/neo-quiz-setup-*.exe apps/windows/dist-installer/neo-quiz-setup.exe

      # `latest.yml` et le `.blockmap` sont ce qu'electron-updater lit : la
      # version à comparer, le sha512 à vérifier, et les blocs à ne pas
      # retélécharger (spec de la mise à jour automatique, §3.1).
      - name: Attach installer to release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.plugin.outputs.tag }}"
          files: |
            apps/windows/dist-installer/*.exe
            apps/windows/dist-installer/*.exe.blockmap
            apps/windows/dist-installer/latest.yml
            apps/windows/dist-installer/neo-quiz-setup.exe

  app-linux:
    needs: plugin
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20
      - name: Install dependencies (racine)
        run: npm ci
      - name: Install dependencies (apps/windows)
        run: npm ci
        working-directory: apps/windows
      # Même garde que le job `plugin` : « Rien à changer » sort en 1.
      - name: Update manifest version
        shell: bash
        env:
          VERSION_VOULUE: ${{ needs.plugin.outputs.version }}
        run: |
          actuelle=$(node -p "require('./src/assets/manifest.json').version")
          if [ "$actuelle" != "$VERSION_VOULUE" ]; then node scripts/set-version.mjs "$VERSION_VOULUE"; fi
      - name: Build and package (AppImage)
        run: npm run pack:linux
        working-directory: apps/windows
      - name: Package config and contents
        run: npm run check:package
      - name: Upload AppImage (répétition)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: neo-quiz-linux-appimage
          path: |
            apps/windows/dist-installer/*.AppImage
            apps/windows/dist-installer/latest-linux.yml
          if-no-files-found: error
      # Même copie sous nom fixe que pour l'installeur Windows : le lien
      # permanent de la page de téléchargement vers l'AppImage vise
      # releases/latest/download/neo-quiz.AppImage, jamais le nom versionné.
      - name: Copy AppImage under a fixed name
        shell: bash
        run: |
          ls apps/windows/dist-installer/neo-quiz-*.AppImage
          cp apps/windows/dist-installer/neo-quiz-*.AppImage apps/windows/dist-installer/neo-quiz.AppImage

      - name: Attach AppImage to release
        if: github.event_name != 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "${{ needs.plugin.outputs.tag }}"
          files: |
            apps/windows/dist-installer/*.AppImage
            apps/windows/dist-installer/latest-linux.yml
            apps/windows/dist-installer/neo-quiz.AppImage

  # La page de téléchargement lit `docs/latest.json` (servi par GitHub Pages,
  # sans limite de requêtes) plutôt que l'API GitHub, qui refuse au-delà de
  # 60 appels par heure et par adresse IP sans jeton : une promo derrière un
  # même réseau l'atteignait en quelques minutes et la page perdait ses
  # versions. Ce job tourne une fois les trois autres finis, quand tous les
  # fichiers sont attachés, et pousse le JSON sur `main` (Pages se republie).
  site:
    needs: [plugin, app-windows, app-linux]
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Write docs/latest.json from the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plugin.outputs.tag }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" \
            --jq '{tag_name, published_at, assets: [.assets[] | {name, size, browser_download_url}]}' \
            > docs/latest.json
          cat docs/latest.json

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/latest.json
          git diff --cached --quiet && echo "latest.json inchangé" || git commit -m "site: latest.json pour ${{ needs.plugin.outputs.tag }}"
          git push origin main
