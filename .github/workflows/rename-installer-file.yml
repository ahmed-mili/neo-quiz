name: Rename installer file

on:
  push:
    branches:
      - main

jobs:
  rename:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rename public bootstrapper references
        shell: bash
        run: |
          mapfile -t files < <(git grep -l -F 'neo-quiz-installer.exe' -- . ':(exclude).github/workflows/rename-installer-file.yml' || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "Aucune référence à renommer."
            exit 0
          fi
          for file in "${files[@]}"; do
            sed -i 's/neo-quiz-installer\.exe/Install-NeoQuiz.exe/g' "$file"
          done
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "${files[@]}"
          git commit -m 'chore(installer): rename public executable'
          git push origin HEAD:main
