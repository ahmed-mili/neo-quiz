name: Repair desktop v1.0.4

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-v1.0.4.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: repair-desktop-v1.0.4
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix apps/windows

      - name: Apply permanent publication fix
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python <<'PY'
          from pathlib import Path

          workflow_path = Path('.github/workflows/release.yml')
          workflow = workflow_path.read_text(encoding='utf-8')

          old = "make_latest: ${{ steps.version.outputs.product == 'app' }}"
          if workflow.count(old) != 1:
              raise SystemExit(f"attendu 1 ancien make_latest prepare, obtenu {workflow.count(old)}")
          workflow = workflow.replace(old, 'make_latest: "false"', 1)

          if workflow.count('make_latest: "true"') != 2:
              raise SystemExit(f"attendu 2 promotions prématurées des jobs assets, obtenu {workflow.count('make_latest: \"true\"')}")
          workflow = workflow.replace('make_latest: "true"', 'make_latest: "false"')

          old_comment = '''  # Résout version / tag / produit une seule fois, et crée la release AVANT
  # les builds : c'est ainsi que les jobs `plugin` / `app-windows` /
  # `app-linux` peuvent y attacher leurs fichiers sans se disputer la
  # création (un Windows et un Linux qui créeraient chacun la release en
  # feraient deux, en double).'''
          new_comment = '''  # Résout version / tag / produit une seule fois et crée la release AVANT
  # les builds, mais JAMAIS comme `latest`. Les jobs peuvent ainsi y attacher
  # leurs fichiers sans se disputer la création, tandis que l'ancienne app
  # reste servie jusqu'à ce que Windows + Linux aient fini et que les assets
  # indispensables aient été vérifiés. La promotion `latest` se fait dans
  # le job `site`, une seule fois la release complète.'''
          if old_comment not in workflow:
              raise SystemExit('commentaire prepare attendu introuvable')
          workflow = workflow.replace(old_comment, new_comment, 1)

          old_create_comment = '''      # Sur tag, ou sur dispatch explicitement publiant, la release existe avant
      # que les jobs de build y attachent leurs fichiers. `make_latest`
      # distingue les deux produits : l'application devient la release
      # « latest » du dépôt, le greffon ne la touche jamais.'''
          new_create_comment = '''      # Sur tag, ou sur dispatch explicitement publiant, la release existe avant
      # que les jobs de build y attachent leurs fichiers, mais reste NON latest.
      # C'est essentiel : `/releases/latest` est consommé par le bootstrapper,
      # donc il ne doit jamais voir une release dont le NSIS ou les bootstrappers
      # ne sont pas encore attachés.'''
          if old_create_comment not in workflow:
              raise SystemExit('commentaire Create Release attendu introuvable')
          workflow = workflow.replace(old_create_comment, new_create_comment, 1)

          old_attach_comment = '''          # Répété comme dans le job `plugin` : le PATCH de l'action ne doit
          # jamais retirer à l'application son statut « latest ».
          make_latest: "false"'''
          new_attach_comment = '''          # L'attachement ne promeut JAMAIS une release incomplète. Le job
          # `site` la rendra latest seulement après succès Windows + Linux et
          # validation des assets indispensables.
          make_latest: "false"'''
          if workflow.count(old_attach_comment) != 2:
              raise SystemExit(f"attendu 2 commentaires d'attachement, obtenu {workflow.count(old_attach_comment)}")
          workflow = workflow.replace(old_attach_comment, new_attach_comment)

          site_anchor = '''      - name: Write latest.json from the release
        env:
          GH_TOKEN: ${{ github.token }}'''
          if workflow.count(site_anchor) != 1:
              raise SystemExit(f"ancre site attendue une fois, obtenue {workflow.count(site_anchor)}")

          promotion_step = '''      - name: Verify app release assets and promote latest
        if: needs.prepare.outputs.product == 'app'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          VERSION: ${{ needs.prepare.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" > "$release_json"

          if ! jq -e '.draft == false and .prerelease == false' "$release_json" >/dev/null; then
            echo "::error::La release ${TAG} est draft ou prerelease."
            exit 1
          fi

          for requis in \
            "Install-NeoQuiz.exe" \
            "Install-NeoQuiz-fr.exe" \
            "neo-quiz-setup-${VERSION}.exe" \
            "neo-quiz-setup-${VERSION}.exe.blockmap" \
            "latest.yml" \
            "neo-quiz-${VERSION}.AppImage" \
            "latest-linux.yml" \
            "neo-quiz.AppImage"
          do
            if ! jq -e --arg nom "$requis" '.assets[] | select(.name == $nom)' "$release_json" >/dev/null; then
              echo "::error::Asset obligatoire absent avant promotion latest : $requis"
              exit 1
            fi
          done

          nsis="neo-quiz-setup-${VERSION}.exe"
          if ! jq -e --arg nom "$nsis" '.assets[] | select(.name == $nom) | .digest | select(type == "string" and test("^sha256:[0-9a-fA-F]{64}$"))' "$release_json" >/dev/null; then
            echo "::error::Le NSIS ${nsis} n'a pas d'empreinte sha256 exploitable par le bootstrapper."
            exit 1
          fi

          release_id=$(jq -er '.id' "$release_json")
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${release_id}" -f make_latest=true >/dev/null
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          if [ "$latest" != "$TAG" ]; then
            echo "::error::La promotion latest a échoué : attendu ${TAG}, obtenu ${latest}."
            exit 1
          fi
          echo "Release ${TAG} promue latest après validation de tous les assets."

'''
          workflow = workflow.replace(site_anchor, promotion_step + site_anchor, 1)
          workflow_path.write_text(workflow, encoding='utf-8')

          check_path = Path('scripts/check-installer.mjs')
          check = check_path.read_text(encoding='utf-8')
          anchor = '''\tr.check("publication : le nom français est une copie du même exe",
\t\tworkflow.includes("cp Install-NeoQuiz.exe Install-NeoQuiz-fr.exe"), true);

\t/* La langue voyage AVEC le fichier : par son nom d'abord, par le flux'''
          if check.count(anchor) != 1:
              raise SystemExit(f"ancre check-installer attendue une fois, obtenue {check.count(anchor)}")
          added = '''\tr.check("publication : le nom français est une copie du même exe",
\t\tworkflow.includes("cp Install-NeoQuiz.exe Install-NeoQuiz-fr.exe"), true);

\tconst debutPromotion = workflow.indexOf("- name: Verify app release assets and promote latest");
\tconst debutLatestJson = workflow.indexOf("- name: Write latest.json from the release");
\tconst blocPromotion = debutPromotion >= 0 && debutLatestJson > debutPromotion
\t\t? workflow.slice(debutPromotion, debutLatestJson)
\t\t: "";
\tr.check("publication : la release est créée sans devenir latest avant les assets",
\t\tworkflow.includes("make_latest: ${{ steps.version.outputs.product == 'app' }}"), false);
\tr.check("publication : les jobs d'assets ne rendent jamais la release latest",
\t\tworkflow.includes('make_latest: "true"'), false);
\tr.check("publication : la promotion finale exige les deux bootstrappers, le NSIS et son sha256",
\t\t[
\t\t\tblocPromotion.includes('"Install-NeoQuiz.exe"'),
\t\t\tblocPromotion.includes('"Install-NeoQuiz-fr.exe"'),
\t\t\tblocPromotion.includes('"neo-quiz-setup-${VERSION}.exe"'),
\t\t\tblocPromotion.includes("sha256:"),
\t\t],
\t\t[true, true, true, true]);
\tr.check("publication : latest est promue seulement après validation des assets et avant latest.json",
\t\tdebutPromotion >= 0 && blocPromotion.includes("-f make_latest=true") && debutLatestJson > debutPromotion,
\t\ttrue);

\t/* La langue voyage AVEC le fichier : par son nom d'abord, par le flux'''
          check = check.replace(anchor, added, 1)
          check_path.write_text(check, encoding='utf-8')
          PY

          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.3" \
            --jq '{tag_name, published_at, assets: [.assets[] | {name, size, browser_download_url}]}' \
            > docs/latest.json

      - name: Validate workflow syntax
        run: ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml", aliases: true); puts "release.yml YAML OK"'

      - name: Prove the new publication check is discriminating
        shell: bash
        run: |
          cp .github/workflows/release.yml /tmp/release.yml.good
          python <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/release.yml')
          s = p.read_text(encoding='utf-8')
          if s.count('-f make_latest=true') != 1:
              raise SystemExit('promotion finale unique introuvable avant discriminance')
          p.write_text(s.replace('-f make_latest=true', '-f make_latest=false', 1), encoding='utf-8')
          PY

          set +e
          npm run check:installer > /tmp/discriminance.log 2>&1
          code=$?
          set -e
          cat /tmp/discriminance.log
          if [ "$code" -eq 0 ]; then
            echo "::error::Le contrôle discriminant est resté vert après rupture volontaire."
            exit 1
          fi
          if ! grep -F 'ÉCHEC  publication : latest est promue seulement après validation des assets et avant latest.json' /tmp/discriminance.log >/dev/null; then
            echo "::error::L'assertion nommée attendue n'est pas celle qui a échoué."
            exit 1
          fi

          cp /tmp/release.yml.good .github/workflows/release.yml
          npm run check:installer

      - name: Run pre-publication checks
        run: |
          npm run check:package
          npm run check:updater
          npm --prefix apps/windows run typecheck:installer
          npm test

      - name: Commit permanent fix and temporary site fallback
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/release.yml scripts/check-installer.mjs docs/latest.json
          git diff --cached --exit-code && { echo "::error::Aucune correction à committer."; exit 1; } || true
          git commit -m "fix(release): promote desktop only after assets"
          git push origin main

      - name: Remove this temporary workflow from main
        run: |
          git rm .github/workflows/repair-v1.0.4.yml
          git commit -m "chore: remove temporary desktop repair workflow"
          git push origin main
          echo "CLEAN_MAIN_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Wait until Pages serves the safe 1.0.3 fallback
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for tentative in $(seq 1 60); do
            contenu=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?repair=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$contenu" | grep -F '"tag_name":"desktop-v1.0.3"' >/dev/null; then
              echo "GitHub Pages sert bien le fallback desktop-v1.0.3."
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::GitHub Pages n'a pas basculé sur le fallback 1.0.3 avant suppression."
            exit 1
          fi

      - name: Delete old v1.0.4 release and tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete desktop-v1.0.4 --cleanup-tag --yes
          if gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.4" >/dev/null 2>&1; then
            echo "::error::L'ancienne release desktop-v1.0.4 existe encore."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/desktop-v1.0.4" >/dev/null 2>&1; then
            echo "::error::L'ancien tag desktop-v1.0.4 existe encore."
            exit 1
          fi
          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          if [ "$latest" != "desktop-v1.0.3" ]; then
            echo "::error::Après suppression, latest devrait être desktop-v1.0.3, obtenu ${latest}."
            exit 1
          fi

      - name: Dispatch the normal desktop release chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.4 -f product=app -f publish=true
          run_id=""
          for tentative in $(seq 1 30); do
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --limit 30 --json databaseId,headSha,createdAt \
              --jq ".[] | select(.headSha == \"${CLEAN_MAIN_SHA}\") | .databaseId" | head -n 1)
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "::error::Impossible de retrouver le run release.yml déclenché."
            exit 1
          fi
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Run de publication : $run_id"

      - name: Wait for the release CI final result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          gh run watch "$RELEASE_RUN_ID" --exit-status --interval 10
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            echo "::group::Release failure details"
            gh run view "$RELEASE_RUN_ID" --log-failed || true
            echo "::endgroup::"
            exit "$code"
          fi
          conclusion=$(gh run view "$RELEASE_RUN_ID" --json conclusion --jq '.conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "::error::Conclusion CI inattendue : $conclusion"
            exit 1
          fi

      - name: Verify recreated release and Download page
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.4" > "$release_json"
          for requis in \
            "Install-NeoQuiz.exe" \
            "Install-NeoQuiz-fr.exe" \
            "neo-quiz-setup-1.0.4.exe" \
            "neo-quiz-setup-1.0.4.exe.blockmap" \
            "latest.yml" \
            "neo-quiz-1.0.4.AppImage" \
            "latest-linux.yml" \
            "neo-quiz.AppImage"
          do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom)' "$release_json" >/dev/null || {
              echo "::error::Asset final absent : $requis"
              exit 1
            }
          done
          jq -e --arg nom "neo-quiz-setup-1.0.4.exe" '.assets[] | select(.name == $nom) | .digest | select(type == "string" and test("^sha256:[0-9a-fA-F]{64}$"))' "$release_json" >/dev/null || {
            echo "::error::Le NSIS final n'a pas de sha256 exploitable."
            exit 1
          }

          latest=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')
          [ "$latest" = "desktop-v1.0.4" ] || { echo "::error::Latest GitHub est ${latest}, pas desktop-v1.0.4."; exit 1; }

          main_latest=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/latest.json?ref=main" --jq '.content' | base64 -d)
          printf '%s' "$main_latest" | grep -F '"tag_name":"desktop-v1.0.4"' >/dev/null || {
            echo "::error::docs/latest.json sur main n'est pas encore en 1.0.4."
            exit 1
          }

          ok=0
          for tentative in $(seq 1 60); do
            page=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?repair-final=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$page" | grep -F '"tag_name":"desktop-v1.0.4"' >/dev/null \
              && printf '%s' "$page" | grep -F '"name":"Install-NeoQuiz.exe"' >/dev/null \
              && printf '%s' "$page" | grep -F '"name":"Install-NeoQuiz-fr.exe"' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::GitHub Pages ne sert pas encore la nouvelle 1.0.4 avec les deux bootstrappers."
            exit 1
          fi

          {
            echo "### Desktop v1.0.4 reconstruite"
            echo "- CI release : success"
            echo "- Install-NeoQuiz.exe : présent"
            echo "- Install-NeoQuiz-fr.exe : présent"
            echo "- NSIS versionné + latest.yml : présents"
            echo "- Linux : présents"
            echo "- docs/latest.json : desktop-v1.0.4"
            echo "- GitHub Pages : desktop-v1.0.4"
          } >> "$GITHUB_STEP_SUMMARY"
