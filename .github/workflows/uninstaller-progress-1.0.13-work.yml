name: Uninstaller progress 1.0.13

on:
  push:
    paths:
      - '.github/workflows/uninstaller-progress-1.0.13-work.yml'

permissions:
  contents: write
  actions: write

jobs:
  implement-publish-verify:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows

      - name: Update package check and version
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('scripts/check-package.mjs')
          s = p.read_text(encoding='utf-8')
          pattern = re.compile(r'r\.check\("désinstallation : fenêtre Neo Quiz stylisée avec vrai spinner à huit points",[\s\S]*?\);\nr\.check\("author\.name est celui attendu par winget et SignPath"')
          replacement = '''r.check("désinstallation : petite fenêtre Neo Quiz stylisée avec progression réelle",
          \t[
          \t\tconfig.nsis?.oneClick,
          \t\tconfig.nsis?.perMachine,
          \t\tuninstallerNsis.includes("removeDefaultUninstallWelcomePage"),
          \t\tuninstallerNsis.includes("MUI_PAGE_CUSTOMFUNCTION_SHOW un.NeoQuizAfficherDesinstallationStylisee"),
          \t\tuninstallerNsis.includes("SetCtlColors $NeoQuizDialogueProgression F7F9FF 07101D"),
          \t\tuninstallerNsis.includes("SetCtlColors $NeoQuizBarreTitre F7F9FF 02060E"),
          \t\tuninstallerNsis.includes("SetCtlColors $NeoQuizPisteProgression 000000 1D2A42"),
          \t\tuninstallerNsis.includes("SetCtlColors $NeoQuizRemplissageProgression 000000 5B9DFF"),
          \t\tuninstallerNsis.includes("PBM_GETPOS"),
          \t\tuninstallerNsis.includes("NeoQuizRemplissageProgression"),
          \t\tuninstallerNsis.includes("Désinstallation en cours..."),
          \t\tuninstallerNsis.includes("Uninstalling Neo Quiz..."),
          \t\tuninstallerNsis.includes("CreateRoundRectRgn"),
          \t\tuninstallerNsis.includes("NeoQuizPoint7"),
          \t\tuninstallerNsis.includes("NeoQuizAnimerSpinner"),
          \t\tuninstallerNsis.includes('"STR:$R2%"'),
          \t],
          \t[false, true, true, true, true, true, true, true, true, true, true, true, true, false, false, false]);
          r.check("author.name est celui attendu par winget et SignPath"'''
          s2, n = pattern.subn(replacement, s, count=1)
          if n != 1:
              raise SystemExit('Bloc de contrôle désinstallation 1.0.12 introuvable ou ambigu')
          p.write_text(s2, encoding='utf-8')
          PY

          node scripts/set-version.mjs 1.0.13
          test "$(node -p "require('./apps/windows/package.json').version")" = "1.0.13"
          test "$(node -p "require('./apps/windows/package-lock.json').version")" = "1.0.13"
          test "$(node -p "require('./apps/windows/package-lock.json').packages[''].version")" = "1.0.13"

      - name: Prove progress UI check discrimination
        shell: bash
        run: |
          set -euo pipefail
          cp apps/windows/installer/uninstaller.nsh uninstaller.good.nsh
          python - <<'PY'
          from pathlib import Path
          p = Path('apps/windows/installer/uninstaller.nsh')
          s = p.read_text(encoding='utf-8')
          old = 'SetCtlColors $NeoQuizRemplissageProgression 000000 5B9DFF'
          if s.count(old) != 1:
              raise SystemExit('Règle de couleur de progression unique introuvable')
          p.write_text(s.replace(old, 'SetCtlColors $NeoQuizRemplissageProgression 000000 DEADBEEF'), encoding='utf-8')
          PY
          set +e
          npm run check:package > discriminance-uninstaller-progress.log 2>&1
          code=$?
          set -e
          cat discriminance-uninstaller-progress.log
          test "$code" -ne 0
          grep -F "ÉCHEC  désinstallation : petite fenêtre Neo Quiz stylisée avec progression réelle" discriminance-uninstaller-progress.log
          mv uninstaller.good.nsh apps/windows/installer/uninstaller.nsh
          npm run check:package

      - name: Run pre-publication checks
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml", aliases: true); puts "release.yml YAML OK"'
          npm run check:package
          npm run check:installer
          npm run check:updater
          npm run check
          npm --prefix apps/windows run typecheck
          npm --prefix apps/windows run typecheck:electron
          npm --prefix apps/windows run typecheck:installer

      - name: Build real Windows package and validate it
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/windows run pack:win
          npm run check:package

      - name: Commit 1.0.13 and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uninstaller-progress-1.0.13-work.yml
          git add scripts/check-package.mjs apps/windows/package.json apps/windows/package-lock.json
          git diff --cached --quiet && { echo "::error::Aucun changement 1.0.13 à committer."; exit 1; }
          git commit -m "fix(uninstaller): ship clean progress window in 1.0.13"
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish through existing release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.13 -f product=app -f publish=true
          run_id=""
          for tentative in $(seq 1 40); do
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --limit 40 --json databaseId,headSha --jq ".[] | select(.headSha == \"${RELEASE_SHA}\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ] || { echo "::error::Run release.yml introuvable."; exit 1; }
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Release run: $run_id"

      - name: Wait for final release CI result
        shell: bash
        run: |
          set +e
          gh run watch "$RELEASE_RUN_ID" --exit-status --interval 10
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh run view "$RELEASE_RUN_ID" --log-failed || true
            exit "$code"
          fi
          test "$(gh run view "$RELEASE_RUN_ID" --json conclusion --jq '.conclusion')" = "success"

      - name: Verify real 1.0.13 release assets and latest
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.13" > "$release_json"
          for requis in "Install-NeoQuiz.exe" "Install-NeoQuiz-fr.exe" "neo-quiz-setup-1.0.13.exe" "neo-quiz-setup-1.0.13.exe.blockmap" "latest.yml" "neo-quiz-1.0.13.AppImage" "latest-linux.yml" "neo-quiz.AppImage"; do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom and .state == "uploaded" and .size > 0)' "$release_json" >/dev/null || { echo "::error::Asset final absent ou vide: $requis"; exit 1; }
          done
          jq -e --arg nom "neo-quiz-setup-1.0.13.exe" '.assets[] | select(.name == $nom) | .digest | select(type == "string" and test("^sha256:[0-9a-fA-F]{64}$"))' "$release_json" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "desktop-v1.0.13"
          version_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/windows/package.json?ref=main" --jq '.content' | base64 -d | jq -r '.version')
          test "$version_main" = "1.0.13"
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/latest.json?ref=main" --jq '.content' | base64 -d)
          printf '%s' "$latest_main" | grep -F '"tag_name":"desktop-v1.0.13"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz.exe"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz-fr.exe"'

      - name: Verify GitHub Pages serves 1.0.13
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for tentative in $(seq 1 60); do
            contenu=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?uninstaller-progress-1013=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$contenu" | grep -F '"tag_name":"desktop-v1.0.13"' >/dev/null && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz.exe"' >/dev/null && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz-fr.exe"' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo "::error::GitHub Pages ne sert pas la 1.0.13 complète."; exit 1; }
          echo "UNINSTALLER_PROGRESS_1_0_13_READY"
