name: Uninstaller spinner 1.0.11

on:
  push:
    paths:
      - ".github/workflows/uninstaller-spinner-1.0.11-work.yml"

permissions:
  contents: write
  actions: write

jobs:
  implement-publish-verify:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm ci --prefix apps/windows

      - name: Update check and version
        shell: bash
        run: |
          set -euo pipefail
          node scripts/prepare-uninstaller-spinner-1.0.11.cjs
          actuelle=$(node -p "require('./apps/windows/package.json').version")
          if [ "$actuelle" != "1.0.11" ]; then node scripts/set-version.mjs 1.0.11; fi
          test "$(node -p "require('./apps/windows/package.json').version")" = "1.0.11"
          test "$(node -p "require('./apps/windows/package-lock.json').version")" = "1.0.11"
          test "$(node -p "require('./apps/windows/package-lock.json').packages[''].version")" = "1.0.11"

      - name: Prove spinner check discrimination
        shell: bash
        run: |
          set -euo pipefail
          cp apps/windows/installer/uninstaller.nsh uninstaller.good.nsh
          node -e "const fs=require('fs');const p='apps/windows/installer/uninstaller.nsh';let s=fs.readFileSync(p,'utf8');const old='Désinstallation en cours...';if((s.split(old).length-1)!==1)process.exit(2);fs.writeFileSync(p,s.replace(old,'BROKEN UNINSTALLER SPINNER'),'utf8')"
          set +e
          npm run check:package > discriminance-uninstaller-spinner.log 2>&1
          code=$?
          set -e
          cat discriminance-uninstaller-spinner.log
          test "$code" -ne 0
          grep -F "ÉCHEC  désinstallation : fenêtre d'attente avec spinner, sans barre de progression" discriminance-uninstaller-spinner.log
          mv uninstaller.good.nsh apps/windows/installer/uninstaller.nsh
          npm run check:package

      - name: Run pre-publication checks
        shell: bash
        run: |
          set -euo pipefail
          ruby -e 'require "yaml"; YAML.load_file(".github/workflows/release.yml", aliases: true); puts "release.yml YAML OK"'
          npm run check:package
          npm run check:installer
          npm run check:updater
          npm run check
          npm --prefix apps/windows run typecheck
          npm --prefix apps/windows run typecheck:electron
          npm --prefix apps/windows run typecheck:installer

      - name: Build real Windows package and validate it
        shell: bash
        run: |
          set -euo pipefail
          npm --prefix apps/windows run pack:win
          npm run check:package

      - name: Commit 1.0.11 and clean temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/uninstaller-spinner-1.0.11-work.yml scripts/prepare-uninstaller-spinner-1.0.11.cjs
          git add scripts/check-package.mjs apps/windows/package.json apps/windows/package-lock.json
          git diff --cached --quiet && { echo "::error::Aucun changement 1.0.11 à committer."; exit 1; }
          git commit -m "fix(uninstaller): use spinner waiting window in 1.0.11"
          git push origin main
          echo "RELEASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish through existing release workflow
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run release.yml --ref main -f version=1.0.11 -f product=app -f publish=true
          run_id=""
          for tentative in $(seq 1 40); do
            run_id=$(gh run list --workflow release.yml --event workflow_dispatch --limit 40 --json databaseId,headSha --jq ".[] | select(.headSha == \"${RELEASE_SHA}\") | .databaseId" | head -n 1)
            [ -n "$run_id" ] && break
            sleep 3
          done
          [ -n "$run_id" ] || { echo "::error::Run release.yml introuvable."; exit 1; }
          echo "RELEASE_RUN_ID=$run_id" >> "$GITHUB_ENV"
          echo "Release run: $run_id"

      - name: Wait for final release CI result
        shell: bash
        run: |
          set +e
          gh run watch "$RELEASE_RUN_ID" --exit-status --interval 10
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            gh run view "$RELEASE_RUN_ID" --log-failed || true
            exit "$code"
          fi
          test "$(gh run view "$RELEASE_RUN_ID" --json conclusion --jq '.conclusion')" = "success"

      - name: Verify real 1.0.11 release assets and latest
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(mktemp)
          gh api "repos/${GITHUB_REPOSITORY}/releases/tags/desktop-v1.0.11" > "$release_json"
          for requis in "Install-NeoQuiz.exe" "Install-NeoQuiz-fr.exe" "neo-quiz-setup-1.0.11.exe" "neo-quiz-setup-1.0.11.exe.blockmap" "latest.yml" "neo-quiz-1.0.11.AppImage" "latest-linux.yml" "neo-quiz.AppImage"; do
            jq -e --arg nom "$requis" '.assets[] | select(.name == $nom and .state == "uploaded" and .size > 0)' "$release_json" >/dev/null || { echo "::error::Asset final absent ou vide: $requis"; exit 1; }
          done
          jq -e --arg nom "neo-quiz-setup-1.0.11.exe" '.assets[] | select(.name == $nom) | .digest | select(type == "string" and test("^sha256:[0-9a-fA-F]{64}$"))' "$release_json" >/dev/null
          test "$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')" = "desktop-v1.0.11"
          version_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/apps/windows/package.json?ref=main" --jq '.content' | base64 -d | jq -r '.version')
          test "$version_main" = "1.0.11"
          latest_main=$(gh api "repos/${GITHUB_REPOSITORY}/contents/docs/latest.json?ref=main" --jq '.content' | base64 -d)
          printf '%s' "$latest_main" | grep -F '"tag_name":"desktop-v1.0.11"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz.exe"'
          printf '%s' "$latest_main" | grep -F '"name":"Install-NeoQuiz-fr.exe"'

      - name: Verify GitHub Pages serves 1.0.11
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for tentative in $(seq 1 60); do
            contenu=$(curl -fsSL "https://ahmed-mili.github.io/neo-quiz/latest.json?uninstaller-spinner-111=${GITHUB_RUN_ID}-${tentative}" || true)
            if printf '%s' "$contenu" | grep -F '"tag_name":"desktop-v1.0.11"' >/dev/null && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz.exe"' >/dev/null && printf '%s' "$contenu" | grep -F '"name":"Install-NeoQuiz-fr.exe"' >/dev/null; then
              ok=1
              break
            fi
            sleep 5
          done
          [ "$ok" -eq 1 ] || { echo "::error::GitHub Pages ne sert pas la 1.0.11 complète."; exit 1; }
          echo "UNINSTALLER_SPINNER_1_0_11_READY"
