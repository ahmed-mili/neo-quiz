name: Verify Pages 1.0.15 once

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-pages-1.0.15-once.yml'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Verify live Pages content
        shell: bash
        run: |
          ok=false
          for i in {1..60}; do
            body=$(curl --fail --silent --show-error -H 'Cache-Control: no-cache' "https://ahmed-mili.github.io/neo-quiz/latest.json?nocache=$(date +%s%N)" || true)
            if printf '%s' "$body" | grep -q '"tag_name":"desktop-v1.0.15"' \
              && printf '%s' "$body" | grep -q '"name":"Install-NeoQuiz.exe"' \
              && printf '%s' "$body" | grep -q '"name":"Install-NeoQuiz-fr.exe"'; then
              ok=true
              break
            fi
            sleep 10
          done
          test "$ok" = true
      - name: Remove temporary workflow
        shell: bash
        run: |
          rm .github/workflows/verify-pages-1.0.15-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: remove Pages 1.0.15 verifier"
          git push origin main
