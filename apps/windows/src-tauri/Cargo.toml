[package]
name = "neo-quiz-windows"
version = "0.0.0"
edition = "2021"

[lib]
name = "neo_quiz_windows_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "neo-quiz"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `protocol-asset` : sans cette fonctionnalité, `Manager::asset_protocol_scope`
# n'existe pas et `allow_folder` ne compile pas. C'est elle qui sert les images
# des quiz au frontend (convertFileSrc).
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2.7.3"
tauri-plugin-fs = "2.5.2"
tauri-plugin-opener = "2.5.5"
tauri-plugin-store = "2.4.4"
tauri-plugin-window-state = "2"
